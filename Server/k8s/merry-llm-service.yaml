apiVersion: v1
kind: Service

metadata:
  name: merry-llm
  namespace: merry-ai
  labels:
    app: merry-llm

spec:
  type: NodePort

  selector:
    app: merry-llm

  ports:
    - name: http
      protocol: TCP
      port: 8100
      targetPort: 8100
      nodePort: 31033

      # nodePort를 명시하지 않고
      # Kubernetes가 사용 가능한 포트를 자동 할당하도록 함