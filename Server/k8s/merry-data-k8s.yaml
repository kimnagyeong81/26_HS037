# ============================================================
# 1. 영구 저장소 StorageClass
# ============================================================

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: merry-retain-local

provisioner: rancher.io/local-path

reclaimPolicy: Retain

volumeBindingMode: WaitForFirstConsumer

---
# ============================================================
# 2. Kafka Headless Service
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: merry-kafka-headless
  namespace: merry-ai

spec:
  clusterIP: None
  publishNotReadyAddresses: true

  selector:
    app: merry-kafka

  ports:
    - name: broker
      port: 9092
      targetPort: broker

    - name: controller
      port: 9093
      targetPort: controller

---
# ============================================================
# 3. Kafka ClusterIP Service
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: merry-kafka
  namespace: merry-ai

spec:
  type: ClusterIP

  selector:
    app: merry-kafka

  ports:
    - name: broker
      port: 9092
      targetPort: broker

---
# ============================================================
# 4. Kafka StatefulSet
# ============================================================

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: merry-kafka
  namespace: merry-ai

spec:
  serviceName: merry-kafka-headless
  replicas: 1

  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain

  selector:
    matchLabels:
      app: merry-kafka

  template:
    metadata:
      labels:
        app: merry-kafka

    spec:
      nodeSelector:
        merry-ai-host: "true"

      terminationGracePeriodSeconds: 90

      securityContext:
        fsGroup: 1000

      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          imagePullPolicy: IfNotPresent

          env:
            # KRaft 클러스터 ID
            - name: CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: merry-kafka-cluster
                  key: CLUSTER_ID

            - name: KAFKA_NODE_ID
              value: "1"

            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"

            # Kafka 리스너
            - name: KAFKA_LISTENERS
              value: >-
                PLAINTEXT://:9092,CONTROLLER://:9093

            - name: KAFKA_ADVERTISED_LISTENERS
              value: >-
                PLAINTEXT://merry-kafka-0.merry-kafka-headless.merry-ai.svc.cluster.local:9092

            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: >-
                PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"

            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"

            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: >-
                1@merry-kafka-0.merry-kafka-headless.merry-ai.svc.cluster.local:9093

            # Kafka 메시지 및 KRaft 메타데이터 저장
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"

            # 단일 Broker 설정
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"

            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"

            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"

            - name: KAFKA_HEAP_OPTS
              value: "-Xms256m -Xmx768m"

          ports:
            - name: broker
              containerPort: 9092

            - name: controller
              containerPort: 9093

          # 최초 실행 대기
          startupProbe:
            tcpSocket:
              port: broker
            periodSeconds: 5
            failureThreshold: 36

          # Kafka API 정상 응답 확인
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  /opt/kafka/bin/kafka-broker-api-versions.sh
                  --bootstrap-server 127.0.0.1:9092
                  >/dev/null 2>&1

            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3

          # 프로세스 연결 상태 확인
          livenessProbe:
            tcpSocket:
              port: broker
            periodSeconds: 20
            timeoutSeconds: 5

          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"

            limits:
              cpu: "2000m"
              memory: "2Gi"

          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data

  volumeClaimTemplates:
    - metadata:
        name: kafka-data

      spec:
        accessModes:
          - ReadWriteOnce

        storageClassName: merry-retain-local

        resources:
          requests:
            storage: 10Gi

---
# ============================================================
# 5. MongoDB Headless Service
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: merry-mongodb-headless
  namespace: merry-ai

spec:
  clusterIP: None

  selector:
    app: merry-mongodb

  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb

---
# ============================================================
# 6. MongoDB ClusterIP Service
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: merry-mongodb
  namespace: merry-ai

spec:
  type: ClusterIP

  selector:
    app: merry-mongodb

  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb

---
# ============================================================
# 7. MongoDB StatefulSet
# ============================================================

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: merry-mongodb
  namespace: merry-ai

spec:
  serviceName: merry-mongodb-headless
  replicas: 1

  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain

  selector:
    matchLabels:
      app: merry-mongodb

  template:
    metadata:
      labels:
        app: merry-mongodb

    spec:
      nodeSelector:
        merry-ai-host: "true"

      terminationGracePeriodSeconds: 90

      containers:
        - name: mongodb
          image: mongo:7.0.31-jammy
          imagePullPolicy: IfNotPresent

          args:
            - "--bind_ip_all"

          # 신규 DB 초기 관리자 계정
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: merry-mongo-auth
                  key: MONGO_INITDB_ROOT_USERNAME

            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: merry-mongo-auth
                  key: MONGO_INITDB_ROOT_PASSWORD

          ports:
            - name: mongodb
              containerPort: 27017

          # MongoDB 최초 실행 대기
          startupProbe:
            tcpSocket:
              port: mongodb

            periodSeconds: 5
            failureThreshold: 36

          # 인증 후 DB 명령 실행
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  mongosh --quiet --host 127.0.0.1
                  --username "$MONGO_INITDB_ROOT_USERNAME"
                  --password "$MONGO_INITDB_ROOT_PASSWORD"
                  --authenticationDatabase admin
                  --eval 'quit(db.adminCommand({ping:1}).ok === 1 ? 0 : 1)'

            periodSeconds: 10
            timeoutSeconds: 10

          # MongoDB TCP 연결 확인
          livenessProbe:
            tcpSocket:
              port: mongodb

            periodSeconds: 20
            timeoutSeconds: 5

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "2000m"
              memory: "2Gi"

          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db

  volumeClaimTemplates:
    - metadata:
        name: mongodb-data

      spec:
        accessModes:
          - ReadWriteOnce

        storageClassName: merry-retain-local

        resources:
          requests:
            storage: 20Gi
